<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angel Glam Beauty | Cosméticos naturales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a href="#inicio" class="logo"><img src="logo.jpg" alt="Angel Glam Beauty, inicio" width="56" height="56"></a>
  <nav>
    <a href="#productos">Productos</a>
    <a href="#nosotras">Nuestra fórmula</a>
    <a href="#contacto">Contacto</a>
  </nav>
  <div class="acciones">
    <span id="saludo"></span>
    <button id="btnAdmin" class="link" hidden>Administrar productos</button>
    <button id="btnLogin" class="link">Iniciar sesión</button>
    <button id="btnRegistro" class="crear">Crear cuenta</button>
    <button id="btnSalir" class="link" hidden>Salir</button>
    <button id="btnCarrito" class="carrito">Carrito <b id="cuenta">0</b></button>
  </div>
</header>
<main id="inicio">
  <section class="hero">
    <div class="hero-texto">
      <h1>Maquillaje que nace de las plantas y cuida tu piel.</h1>
      <p>Labiales, bases y tratamientos con ingredientes de origen natural: sin parabenos, sin fragancias artificiales y sin pruebas en animales.</p>
      <a href="#productos" class="btn">Ver productos</a>
    </div>
    <img class="hero-logo" src="logo.jpg" alt="Ángel sosteniendo un espejo, logo de Angel Glam" width="460" height="460">
  </section>

  <section id="productos" class="seccion">
    <h2>Nuestros productos</h2>
    <div class="barra">
      <div class="filtros" id="filtros"></div>
      <input id="buscar" type="search" placeholder="Buscar producto" aria-label="Buscar producto">
    </div>
    <div class="grilla" id="grilla"></div>
  </section>
